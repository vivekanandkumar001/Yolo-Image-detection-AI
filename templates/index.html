<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Proctoring System - YOLOv5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .main-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background-color: #4e73df;
            border: none;
        }
        .btn-success {
            background-color: #1cc88a;
            border: none;
        }
        .divider {
            color: #858796;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card main-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">AI Proctoring System</h2>
                        <p class="text-muted">Object Detection & Behavior Analysis via YOLOv5</p>
                    </div>

                    <div class="p-3 border rounded bg-white">
                        <h5 class="mb-3">Analyze Image File</h5>
                        <form action="/detect" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="file" class="form-label text-secondary">Select an image to check for prohibited objects</label>
                                <input class="form-control" type="file" name="file" id="file" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Run Analysis</button>
                            </div>
                        </form>
                    </div>

                    <div class="mt-4 text-center">
                        <hr>
                        <h5 class="divider">OR</h5>
                        <div class="mt-3 p-3">
                            <p class="text-secondary mb-3">Launch real-time monitoring for exams or interviews</p>
                            <a href="{{ url_for('live') }}" class="btn btn-success btn-lg px-5">
                                <i class="bi bi-camera-video"></i> Start Live Webcam Proctoring
                            </a>
                        </div>
                    </div>

                    <div class="mt-4 text-center text-muted small">
                        <p>Powered by YOLOv5 and MediaPipe Face Mesh</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
